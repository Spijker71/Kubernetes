apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: excel-conversion-dev
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./Flux/Dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: datalogistiek/kubernetes
  targetNamespace: dtlgt-dev
  ignore:
    - paths:
        - /spec/jobTargetRef/template/spec/containers/0/resources/requests/cpu
        - /spec/jobTargetRef/template/spec/containers/0/resources/requests/memory
        - /spec/jobTargetRef/template/spec/containers/0/resources/limits/cpu
        - /spec/jobTargetRef/template/spec/containers/0/resources/limits/memory
      target:
        group: keda.sh
        version: v1alpha1
        kind: ScaledJob
        name: excelconversion-scaler
        namespace: "dtlgt-dev"